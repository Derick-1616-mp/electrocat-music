<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1224">
<title>ElectroMusic</title>
<style>
:root{--bg:#0d1224;--card:#161e3a;--ink:#eef2ff;--mut:#98a2c8;--ac:#3aa0ff;--line:#27315c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:640px;margin:0 auto;padding:12px 14px 24px}
body.hasmp #app{padding-bottom:100px}
h1{font-size:1.35rem;margin:0}h2{font-size:1.1rem;margin:0}
.mut{color:var(--mut);font-size:.85rem}.pad{padding:16px 4px}
.hd{display:flex;align-items:center;gap:10px;margin-bottom:10px}.g{flex:1;min-width:0}
.tabs{display:flex;gap:6px;margin:8px 0 12px}
button{font:inherit;padding:10px 14px;border-radius:10px;border:1px solid var(--ac);background:var(--ac);color:#06142b;cursor:pointer}
.tabs button{flex:1;background:var(--card);color:var(--mut);border-color:var(--line)}
.tabs button.on{background:var(--ac);color:#06142b;border-color:var(--ac);font-weight:700}
button.s{background:transparent;color:var(--ac)}
button.ic{background:none;border:0;color:var(--ink);padding:8px;display:flex;align-items:center;justify-content:center}
button.ic.on{color:var(--ac)}
svg{width:24px;height:24px;fill:currentColor;display:block}
.pp{width:72px;height:72px;border-radius:50%;border:0;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.pp svg{width:38px;height:38px}
.ctl .ic svg{width:30px;height:30px}.sm .pp{width:44px;height:44px}.sm .pp svg{width:26px;height:26px}
input{font:inherit;width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);margin-bottom:8px}
input[type=range]{padding:0;border:0;background:none;margin:10px 0 2px;accent-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:8px 0}
.card p{margin:0 0 10px}
.row{display:flex;align-items:center;gap:8px}.sp{justify-content:space-between}.btns{flex-wrap:wrap;margin:10px 0}
.sg{display:flex;align-items:center;gap:6px;padding:4px 2px;border-bottom:1px solid var(--line)}
.sg.cur .t{color:var(--ac)}.sg .g{padding:6px 0;cursor:pointer}
.t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ck{width:22px;height:22px;border-radius:50%;border:2px solid var(--mut);flex:none;display:flex;align-items:center;justify-content:center;color:#06142b}
.ck.on{background:var(--ac);border-color:var(--ac)}.ck svg{width:16px;height:16px}
.selbar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px solid var(--line)}
.selbar button{padding:8px 10px;font-size:.9rem}
#mp{display:none;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#121a35;border-top:1px solid var(--line);align-items:center;gap:4px;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px))}
#mp img{width:42px;height:42px;border-radius:50%;flex:none}
#ns{display:none;position:fixed;inset:0;z-index:30;background:linear-gradient(#17316b,#0d1224 70%);padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px));overflow:auto}
.nsi{display:flex;flex-direction:column;gap:6px;width:100%;max-width:480px;margin:0 auto;min-height:calc(100vh - 40px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))}
.cp{margin-top:auto;padding-top:22px;text-align:center;color:var(--mut);font-size:.75rem}
.cover{align-self:center;width:min(78vw,300px);aspect-ratio:1;border-radius:50%;object-fit:cover;margin:14px 0;box-shadow:0 12px 40px rgba(0,0,0,.55);background:#e9ecf3}
.big2{font-size:1.3rem;white-space:normal}
#md{display:none;position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);align-items:center;justify-content:center;padding:20px}
.mb{background:var(--card);border-radius:14px;padding:16px;width:100%;max-width:360px;max-height:85vh;overflow:auto}
.mb h2{margin-bottom:6px}
.mi{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;color:var(--ink);padding:13px 6px;border-radius:8px}
.mi:active{background:var(--line)}.mi svg{color:var(--mut)}
.mi.sel{color:var(--ac)}
.kv{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}.kv b{width:84px;flex:none;color:var(--mut);font-weight:500}.kv span{min-width:0;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:110px;background:#fff;color:#111;padding:10px 16px;border-radius:20px;z-index:60;font-size:.9rem}
</style>
</head>
<body>
<div id="app"></div>
<div id="mp"></div>
<div id="ns"></div>
<div id="md"></div>

/* ---- Android back button (sent from the app) ---- */
function backAction(){
  if($("md").style.display=="flex"){hideMd();return}
  if($("ns").style.display=="flex"){hideNs();return}
  if(SELM){selOff();return}
  if(OPL){OPL=null;render();return}
  if(TAB!="songs"){TAB="songs";render();return}
  if(EXITARM){const p=plug();if(p&&p.exit)p.exit();return}
  EXITARM=true;toast("Press back again to exit");setTimeout(()=>{EXITARM=false},2000)}

/* ---- finding music ---- */
function plug(){return window.Capacitor&&((Capacitor.Plugins&&Capacitor.Plugins.Music)||(Capacitor.registerPlugin&&Capacitor.registerPlugin("Music")))}
function scan(){
  if(!NATIVE)return;const p=plug();if(!p){ST="denied";render();return}
  ST="scanning";render();
  p.scan().then(r=>{SONGS=((r&&r.songs)||[]).map(x=>({id:"n"+x.id,name:String(x.title||x.name||"Unknown").trim(),artist:x.artist||"",album:x.album||"",added:x.added||0,size:x.size||0,dur:Math.round((x.duration||0)/1000),path:x.path||""}));ST="ok";LAST=Date.now();render();restore()}).catch(()=>{ST="denied";render()})}
function webFiles(list){const a=[...list].filter(f=>(f.type||"").startsWith("audio")||/\.(mp3|m4a|aac|wav|ogg|opus|flac)$/i.test(f.name));SONGS=a.map((f,i)=>({id:"w"+i+"_"+f.size,name:f.name.replace(/\.[^.]+$/,""),artist:"",album:"",added:Math.round(f.lastModified/1000),size:f.size,dur:0,path:f.name,url:URL.createObjectURL(f)}));ST="ok";render()}
document.addEventListener("visibilitychange",()=>{if(NATIVE&&!document.hidden&&ST=="ok"&&Date.now()-LAST>60000){const p=plug();p&&p.scan().then(r=>{if(r&&r.songs&&r.songs.length!=SONGS.length)scan()}).catch(()=>{})}});

/* ---- playback ---- */
function nativeAudio(){
  const L={};let poll=null;
  const o={paused:true,duration:0,_t:0,
    addEventListener(n,f){(L[n]=L[n]||[]).push(f)},
    emit(n){(L[n]||[]).slice().forEach(f=>f())},
    get currentTime(){return this._t},
    set currentTime(v){this._t=+v;const p=plug();if(p)p.seek({ms:Math.round(v*1000)}).catch(()=>{})},
    setPlaying(b){this.paused=!b;if(b)this.startPoll();else this.stopPoll()},
    startPoll(){this.stopPoll();poll=setInterval(()=>{const p=plug();if(!p||o.paused)return;p.status().then(s=>{o._t=(s.position||0)/1000;if(s.duration>0)o.duration=s.duration/1000;o.emit("timeupdate")}).catch(()=>{})},500)},
    stopPoll(){if(poll){clearInterval(poll);poll=null}},
    play(){const p=plug();if(p)p.resume().catch(()=>{});this.setPlaying(true);this.emit("play");return Promise.resolve()},
    pause(){const p=plug();if(p)p.pause().catch(()=>{});this.setPlaying(false);this.emit("pause")}
  };
  const p=plug();
  if(p&&p.addListener){
    p.addListener("state",e=>{const on=!!(e&&e.playing);o.setPlaying(on);o.emit(on?"play":"pause")});
    p.addListener("track",e=>{if(e&&e.index!=null){qi=e.index;const s=songById(QUEUE[qi]);if(s)CUR=s}o._t=0;o.duration=((e&&e.duration)||0)/1000;upd();tick()});
    p.addListener("closed",()=>{o.setPlaying(false);CUR=null;QUEUE=[];qi=-1;upd()});
    p.addListener("error",()=>{toast("A song could not be played.")})}
  return o}
const numId=id=>Number(String(id).slice(1));
function nativePlay(){const p=plug();CUR=songById(QUEUE[qi]);if(!p||!CUR)return;
  const info=QUEUE.map(songById);
  p.playQueue({ids:QUEUE.map(numId),titles:info.map(x=>x?dn(x):""),artists:info.map(x=>x?x.artist:""),index:qi,shuffle:SHUF,repeat:REP}).catch(()=>toast("Can’t play this file"));
  AUD.setPlaying(true);AUD._t=0;AUD.duration=0;upd()}
function setModes(){P.shuf=SHUF;P.rep=REP;save();const p=NATIVE&&plug();if(p&&p.setModes)p.setModes({shuffle:SHUF,repeat:REP}).catch(()=>{})}
function restore(){const p=plug();if(!p||!p.getState||CUR)return;
  p.getState().then(r=>{if(!r||!r.active)return;QUEUE=(r.ids||[]).map(i=>"n"+i);qi=r.index||0;CUR=songById(QUEUE[qi]);if(!CUR)return;SHUF=!!r.shuffle;REP=r.repeat||0;AUD._t=(r.position||0)/1000;AUD.duration=(r.duration||0)/1000;AUD.setPlaying(!!r.playing);upd()}).catch(()=>{})}
const songById=id=>SONGS.find(x=>x.id==id)||null;
const srcOf=x=>x.url||(NATIVE?String(x.id).slice(1):Capacitor.convertFileSrc(x.path));
function lk(on){}
function playId(id,list){QUEUE=list&&list.length?list.slice():[id];qi=QUEUE.indexOf(id);if(qi<0){QUEUE=[id];qi=0}if(NATIVE){nativePlay();return}start()}
function start(){CUR=songById(QUEUE[qi]);if(!CUR)return;AUD.src=srcOf(CUR);const pr=AUD.play();if(pr&&pr.catch)pr.catch(()=>toast("Can’t play this file"));media();upd()}
function nextSong(auto){if(NATIVE){const p=plug();if(p)p.nextTrack().catch(()=>{});return}if(!QUEUE.length)return;if(REP==2&&auto){AUD.currentTime=0;AUD.play();return}
  if(SHUF&&QUEUE.length>1){let n;do{n=Math.floor(Math.random()*QUEUE.length)}while(n==qi);qi=n}
  else{qi++;if(qi>=QUEUE.length){if(REP==1||!auto)qi=0;else{AUD.pause();qi=QUEUE.length-1;upd();return}}}
  start()}
function prev(){if(NATIVE){const p=plug();if(p)p.prevTrack().catch(()=>{});return}if(!QUEUE.length)return;if(AUD.currentTime>3){AUD.currentTime=0;return}qi=qi>0?qi-1:QUEUE.length-1;start()}
function toggle(){if(!CUR)return;if(AUD.paused)AUD.play();else AUD.pause()}
function media(){if("mediaSession"in navigator){try{navigator.mediaSession.metadata=new MediaMetadata({title:dn(CUR),artist:CUR.artist||"ElectroMusic"});const h=(a,f)=>navigator.mediaSession.setActionHandler(a,f);h("play",toggle);h("pause",toggle);h("nexttrack",()=>nextSong(false));h("previoustrack",prev)}catch(e){}}}
function tick(){const k=$("pk");if(k&&!SEEK){k.max=AUD.duration||0;k.value=AUD.currentTime}const t=$("pt");if(t)t.textContent=fmt(AUD.currentTime);const d=$("pd");if(d)d.textContent=fmt(AUD.duration)}
AUD.addEventListener("play",()=>{lk(true);upd()});AUD.addEventListener("pause",()=>{lk(false);upd()});
AUD.addEventListener("ended",()=>nextSong(true));AUD.addEventListener("timeupdate",tick);AUD.addEventListener("loadedmetadata",tick);
AUD.addEventListener("error",()=>{if(CUR)toast("This file can’t be played on this phone.")});

/* ---- player bars ---- */
function upd(){
  const m=$("mp");
  if(!CUR){m.style.display="none";document.body.classList.remove("hasmp")}
  else{m.style.display="flex";document.body.classList.add("hasmp");
    m.innerHTML=`<img src="${LOGO}" alt=""><div class="g" onclick="openNs()" style="cursor:pointer"><div class="t">${esc(dn(CUR))}</div><div class="mut">${esc(CUR.artist||"")}</div></div><button class="ic" onclick="prev()" aria-label="Previous">${ICON.prev}</button><span class="sm"><button class="pp" onclick="toggle()" aria-label="Play or pause">${AUD.paused?ICON.play:ICON.pause}</button></span><button class="ic" onclick="nextSong(false)" aria-label="Next">${ICON.next}</button>`}
  if($("ns").style.display=="flex")$("ns").innerHTML=nsHtml()}
function nsHtml(){return CUR?`<div class="nsi"><div class="row sp"><button class="ic" onclick="hideNs()" aria-label="Close">${ICON.down}</button><div class="mut">Now playing</div><button class="ic" onclick="songMenu('${CUR.id}')" aria-label="More options">${ICON.more}</button></div><img class="cover" src="${LOGO}" alt=""><div class="t big2">${esc(dn(CUR))}</div><div class="mut">${esc(CUR.artist||"")}</div><input id="pk" type="range" min="0" max="${AUD.duration||0}" step="1" value="${AUD.currentTime}" oninput="SEEK=1;AUD.currentTime=this.value" onchange="SEEK=0"><div class="row sp"><span class="mut" id="pt">${fmt(AUD.currentTime)}</span><span class="mut" id="pd">${fmt(AUD.duration)}</span></div><div class="row sp ctl" style="margin-top:8px"><button class="ic${SHUF?" on":""}" onclick="SHUF=!SHUF;setModes();upd()" aria-label="Shuffle">${ICON.shuffle}</button><button class="ic" onclick="prev()" aria-label="Previous">${ICON.prev}</button><button class="pp" onclick="toggle()" aria-label="Play or pause">${AUD.paused?ICON.play:ICON.pause}</button><button class="ic" onclick="nextSong(false)" aria-label="Next">${ICON.next}</button><button class="ic${REP?" on":""}" onclick="REP=(REP+1)%3;setModes();upd()" aria-label="Repeat">${REP==2?ICON.repeat1:ICON.repeat}</button></div><div class="cp">©2026 Derick Malelo and The ElectroCat company ltd.</div></div>`:""}
function openNs(){if(!CUR)return;$("ns").style.display="flex";$("ns").innerHTML=nsHtml()}
function hideNs(){$("ns").style.display="none"}

/* ---- pop-up menus ---- */
function showMd(h){$("md").innerHTML=`<div class="mb">${h}</div>`;$("md").style.display="flex"}
function hideMd(){$("md").style.display="none"}
const closeMd=hideMd;
$("md").addEventListener("click",e=>{if(e.target.id=="md")hideMd()});
const mi=(icon,label,fn,cls)=>`<button class="mi ${cls||""}" onclick="${fn}">${icon||""}<span>${label}</span></button>`;
function confirmMd(q,sub,fn,lab){CFN=fn;showMd(`<h2>${q}</h2><p class="mut">${sub}</p><div class="row"><button class="s g" onclick="closeMd()">No</button><button class="g" onclick="closeMd();CFN()">${lab}</button></div>`)}

/* ---- song options ---- */
function songMenu(id,plid){const x=songById(id);if(!x)return;
  showMd(`<h2 class="t" style="margin-bottom:4px">${esc(dn(x))}</h2>${mi(ICON.add,"Add to playlist",`plPick(['${id}'])`)}${mi(ICON.share,"Share",`closeMd();shareSong('${id}')`)}${mi(ICON.info,"Info",`infoSong('${id}')`)}${mi(ICON.edit,"Rename",`renameUI('${id}')`)}${plid?mi(ICON.del,"Remove from this playlist",`closeMd();rmFrom('${plid}','${id}')`):""}`)}
function shareSong(id){const x=songById(id);if(!x)return;
  if(NATIVE){const p=plug();if(p&&p.share){p.share({id:String(id).slice(1)}).catch(()=>toast("Can’t share this file"));return}}
  if(navigator.share)navigator.share({title:dn(x)}).catch(()=>{});else toast("Sharing isn’t available here")}
function infoSong(id){const x=songById(id);if(!x)return;
  const ext=(x.path.match(/\.([A-Za-z0-9]+)$/)||[])[1];
  const kv=(k,v)=>v?`<div class="kv"><b>${k}</b><span>${esc(v)}</span></div>`:"";
  showMd(`<h2>Song info</h2>${kv("Title",dn(x))}${dn(x)!=x.name?kv("File title",x.name):""}${kv("Artist",x.artist)}${kv("Album",x.album)}${kv("Length",fmt(x.dur))}${kv("Size",(x.size/1048576).toFixed(2)+" MB")}${kv("Format",ext?ext.toUpperCase():"")}${kv("Added",x.added?new Date(x.added*1000).toLocaleDateString():"")}${kv("Location",x.path)}<button class="s" style="width:100%;margin-top:10px" onclick="closeMd()">Close</button>`)}
function renameUI(id){const x=songById(id);if(!x)return;
  showMd(`<h2>Rename</h2><p class="mut">This changes the name shown in ElectroMusic. The file on your phone is not changed.</p><input id="rn" value="${esc(dn(x))}"><div class="row"><button class="s g" onclick="closeMd()">Cancel</button>${P.names[id]?`<button class="s g" onclick="doRename('${id}',true)">Reset</button>`:""}<button class="g" onclick="doRename('${id}')">Save</button></div>`)}
function doRename(id,reset){const x=songById(id);const v=reset?"":$("rn").value.trim();if(!v||v==x.name)delete P.names[id];else P.names[id]=v;save();closeMd();render()}

/* ---- header menu, sort, select ---- */
const SORTS={name:["Name (A to Z)",(a,b)=>dn(a).localeCompare(dn(b))],nameD:["Name (Z to A)",(a,b)=>dn(b).localeCompare(dn(a))],artist:["Artist",(a,b)=>(a.artist||"~").localeCompare(b.artist||"~")||dn(a).localeCompare(dn(b))],new:["Newest first",(a,b)=>(b.added||0)-(a.added||0)],old:["Oldest first",(a,b)=>(a.added||0)-(b.added||0)],long:["Longest first",(a,b)=>b.dur-a.dur],short:["Shortest first",(a,b)=>a.dur-b.dur]};
function hdMenu(){showMd(`${NATIVE?mi(ICON.refresh,"Refresh music list","closeMd();scan()"):""}${mi(ICON.sel,"Select",`selOn()`)}${mi(ICON.sort,"Sort by","sortUI()")}${mi(ICON.info,"About","aboutUI()")}`)}
function aboutUI(){showMd(`<div style="text-align:center"><img src="${LOGO}" alt="" style="width:110px;height:110px;border-radius:50%"><h2 style="margin:8px 0 2px">ElectroMusic</h2><div class="mut">Version 1.0</div></div><p style="margin:14px 0 6px">ElectroMusic is a simple music player that finds all the music on your phone by itself and plays it.</p><div class="kv"><b>Developer</b><span>Derick Malelo</span></div><div class="kv"><b>Company</b><span>The ElectroCat company ltd</span></div><div class="kv"><b>Features</b><span>Finds your songs automatically, playlists, search, sort, select, share, song info and rename, and keeps playing in the notification and on the lock screen.</span></div><div class="kv"><b>Privacy</b><span>Your music and playlists stay on your phone. Nothing is uploaded.</span></div><p class="mut" style="text-align:center;margin:14px 0 10px">©2026 Derick Malelo and The ElectroCat company ltd.<br>All rights reserved.</p><button class="s" style="width:100%" onclick="closeMd()">Close</button>`)}
function sortUI(){showMd(`<h2>Sort by</h2>${Object.keys(SORTS).map(k=>mi(P.sort==k?ICON.check:"",SORTS[k][0],`setSort('${k}')`,P.sort==k?"sel":"")).join("")}`)}
function setSort(k){P.sort=k;save();closeMd();render()}
function selOn(){closeMd();TAB="songs";OPL=null;SELM=true;SEL=[];render()}
function selOff(){SELM=false;SEL=[];render()}
function selTog(id){const i=SEL.indexOf(id);if(i<0)SEL.push(id);else SEL.splice(i,1);render()}
function selAll(){SEL=filt().map(x=>x.id);render()}
function selAdd(){if(!SEL.length){toast("Select some songs first");return}plPick(SEL.slice())}

/* ---- playlists ---- */
const plOf=id=>P.pls.find(p=>p.id==id);
const plSongs=p=>p.ids.map(songById).filter(Boolean);
function newPl(){const n=$("pn").value.trim();if(!n)return;P.pls.push({id:uid(),name:n,ids:[]});save();render()}
function openPl(id){OPL=id;render()}
function closePl(){OPL=null;render()}
function delPl(id){confirmMd("Delete this playlist?","The songs stay on your phone.",()=>{P.pls=P.pls.filter(p=>p.id!=id);save();if(OPL==id)OPL=null;render()},"Yes, delete")}
function rmFrom(pid,sid){const p=plOf(pid);p.ids=p.ids.filter(i=>i!=sid);save();render()}
function playPl(pid,sid,shuf){const l=plSongs(plOf(pid)).map(x=>x.id);if(!l.length)return;if(shuf){SHUF=true;sid=l[Math.floor(Math.random()*l.length)]}playId(sid||l[0],l)}
function plPick(ids){PICK=ids;showMd(`<h2 style="margin-bottom:10px">Add to playlist</h2>${P.pls.map(p=>`<button class="s" style="width:100%;margin-bottom:6px" onclick="addTo('${p.id}')">${esc(p.name)} (${p.ids.length})</button>`).join("")}<input id="pn2" placeholder="New playlist name" style="margin-top:6px"><button style="width:100%" onclick="createAdd()">Create and add</button><button class="s" style="width:100%;margin-top:6px;border-color:transparent" onclick="closeMd()">Cancel</button>`)}
function addTo(pid){const p=plOf(pid);let n=0;PICK.forEach(i=>{if(!p.ids.includes(i)){p.ids.push(i);n++}});save();closeMd();toast(n+" song"+(n==1?"":"s")+" added to "+p.name);if(SELM)selOff();else render()}
function createAdd(){const n=$("pn2").value.trim();if(!n)return;P.pls.push({id:uid(),name:n,ids:PICK.slice()});save();closeMd();toast("Added to "+n);if(SELM)selOff();else render()}
function addUI(pid){if(!SONGS.length){showMd(`<p>No songs yet. Let the app find your music first.</p><button style="width:100%" onclick="closeMd()">OK</button>`);return}PID=pid;PSEL=plOf(pid).ids.slice();showMd(`<h2>Choose songs</h2><input placeholder="Search songs" oninput="pickList(this.value)"><div id="pk2" style="max-height:45vh;overflow:auto;margin:8px 0"></div><div class="row"><button class="s g" onclick="closeMd()">Cancel</button><button class="g" onclick="savePick()">Done</button></div>`);pickList("")}
function pickList(q){q=(q||"").toLowerCase();const e=$("pk2");if(!e)return;const l=SONGS.filter(x=>(dn(x)+" "+x.artist).toLowerCase().includes(q)).sort(SORTS[P.sort][1]).slice(0,300);e.innerHTML=l.map(x=>`<label class="row sg"><input type="checkbox" style="width:22px;margin:0" ${PSEL.includes(x.id)?"checked":""} onchange="togSel('${x.id}',this.checked)"><span class="g t">${esc(dn(x))}</span></label>`).join("")||'<p class="mut">No match.</p>'}
function togSel(id,on){const i=PSEL.indexOf(id);if(on&&i<0)PSEL.push(id);if(!on&&i>-1)PSEL.splice(i,1)}
function savePick(){const p=plOf(PID),keep=p.ids.filter(i=>PSEL.includes(i));PSEL.forEach(i=>{if(!keep.includes(i))keep.push(i)});p.ids=keep;save();closeMd();render();toast("Playlist updated")}

/* ---- screens ---- */
const filt=()=>{const q=Q.toLowerCase();return SONGS.filter(x=>(dn(x)+" "+x.artist).toLowerCase().includes(q)).sort(SORTS[P.sort][1])};
function playFrom(id){playId(id,filt().map(x=>x.id))}
function songRow(x,play,plid){
  const on=SELM&&SEL.includes(x.id);
  return`<div class="sg${CUR&&CUR.id==x.id?" cur":""}">${SELM?`<span class="ck${on?" on":""}" onclick="selTog('${x.id}')">${on?ICON.check:""}</span>`:""}<div class="g" onclick="${SELM?`selTog('${x.id}')`:play}"><div class="t">${esc(dn(x))}</div><div class="mut">${x.artist?esc(x.artist)+" · ":""}${fmt(x.dur)}</div></div>${SELM?"":`<button class="ic" onclick="songMenu('${x.id}'${plid?`,'${plid}'`:""})" aria-label="More options">${ICON.more}</button>`}</div>`}
function songList(){const l=filt();if(!l.length)return`<p class="mut pad">${SONGS.length?"No match.":"No music found on this phone."}</p>`;return l.slice(0,400).map(x=>songRow(x,`playFrom('${x.id}')`)).join("")+(l.length>400?'<p class="mut pad">Showing the first 400. Search to find the rest.</p>':"")}
function vSongs(){
  if(ST=="scanning")return'<p class="mut pad">Looking for music on your phone…</p>';
  if(ST=="denied")return`<div class="card"><p>Music access is off. Allow it so the app can find the songs on your phone.</p><button onclick="scan()">Allow music access</button><p class="mut" style="margin:10px 0 0">If nothing happens, open Android Settings → Apps → ElectroMusic → Permissions → Music and audio.</p></div>`;
  if(ST=="web")return`<div class="card"><p>This is the browser preview. On an Android phone the app finds your music by itself. Here you can pick files to try the player.</p><input id="wf" type="file" accept="audio/*" multiple style="display:none" onchange="webFiles(this.files)"><button onclick="$('wf').click()">Pick music files</button></div>`;
  return(SELM?`<div class="selbar"><div class="g">${SEL.length} selected</div><button class="s" onclick="selAll()">All</button><button onclick="selAdd()">Add to playlist</button><button class="s" onclick="selOff()">Cancel</button></div>`:`<input id="q" placeholder="Search songs" value="${esc(Q)}" oninput="Q=this.value;$('sl').innerHTML=songList()">`)+`<div id="sl">${songList()}</div>`}
function vPls(){
  const p=OPL&&plOf(OPL);
  if(p){const l=plSongs(p);return`<div class="row"><button class="ic" onclick="closePl()" aria-label="Back">${ICON.back}</button><h2 class="g">${esc(p.name)}</h2></div><div class="row btns"><button onclick="playPl('${p.id}')">Play all</button><button class="s" onclick="playPl('${p.id}',0,1)">Shuffle</button><button class="s" onclick="addUI('${p.id}')">Add songs</button><button class="s" onclick="delPl('${p.id}')">Delete</button></div>`+(l.length?l.map(x=>songRow(x,`playPl('${p.id}','${x.id}')`,p.id)).join(""):'<p class="mut pad">This playlist is empty. Tap Add songs.</p>')}
  return`<div class="card"><input id="pn" placeholder="New playlist name"><button style="width:100%" onclick="newPl()">Create playlist</button></div>`+(P.pls.length?P.pls.map(q=>`<div class="sg"><div class="g" onclick="openPl('${q.id}')"><div class="t">${esc(q.name)}</div><div class="mut">${plSongs(q).length} songs</div></div><button class="s" onclick="playPl('${q.id}')">Play</button></div>`).join(""):'<p class="mut pad">No playlists yet. Create one above.</p>')}
function setTab(t){if(t==TAB)return;OPL=null;TAB=t;if(SELM){SELM=false;SEL=[]}render()}
function render(){
  const y=scrollY;
  $("app").innerHTML=`<div class="hd"><div class="g"><h1>ElectroMusic</h1><div class="mut">${ST=="ok"?SONGS.length+" songs":""}</div></div><button class="ic" onclick="hdMenu()" aria-label="Menu">${ICON.more}</button></div><div class="tabs"><button class="${TAB=="songs"?"on":""}" onclick="setTab('songs')">Songs</button><button class="${TAB=="pls"?"on":""}" onclick="setTab('pls')">Playlists</button></div>${TAB=="songs"?vSongs():vPls()}`;
  scrollTo(0,y);upd()}
render();
if(NATIVE){scan();try{const p=plug();if(p&&p.addListener){p.addListener("back",backAction);if(p.backGuard)p.backGuard().catch(()=>{})}}catch(e){}}
</script>
</body>
</html>
