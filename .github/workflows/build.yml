name: Build music app

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          cp ecm-index.html www/index.html

      - name: Create the Android project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "ElectroMusic" com.electrocat.music --web-dir www
          npx cap add android

      - name: Add the music engine
        run: bash ecm-setup.sh

      - name: App icon
        run: |
          pip install pillow
          python3 ecm-icons.py

      - name: Use the same signing key every time
        run: |
          mkdir -p ~/.android
          cp ecm-debug.keystore ~/.android/debug.keystore

      - name: Build the app
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish the app file
        uses: softprops/action-gh-release@v2
        with:
          tag_name: music-${{ github.run_number }}
          name: ElectroMusic ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
